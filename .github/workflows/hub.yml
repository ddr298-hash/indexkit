name: Generate & publish discovery hub

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate hub
        run: npm run generate-hub -- "${{ vars.NAVER_BLOG_ID }}" "${{ vars.HUB_DOMAIN }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: generated-hub

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit sitemap to Search Console
        if: ${{ vars.HUB_DOMAIN != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/tmp/service-account.json \
            npm run submit-sitemap -- "${{ vars.HUB_DOMAIN }}/" "${{ vars.HUB_DOMAIN }}/sitemap.xml"
